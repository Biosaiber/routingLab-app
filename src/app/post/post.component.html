<div class="post">
    <h2>{{ post.title }}</h2>

    <small>
        By <strong>{{ author.username }}</strong> • {{ post.dateCreated }}
    </small>

    <p>{{ post.content }}</p>

    <div class="tags">
        @for (tag of post.tags; track tag; let last = $last) {
        <small>{{ tag }}@if (!last) {, }</small>
        }
    </div>
    <a routerLink="comments">View Comments</a>
    <router-outlet></router-outlet>
</div>
