@for (post of posts; track post.id) {
<div class="post">
    <h3> <a [routerLink]="['/post', post.id]">{{post.title}}</a></h3>
    <small>
        By <strong><a [routerLink]="['/user', post.userId]">{{ getAuthorName(post.userId) }}</a></strong> • {{ post.dateCreated }}
    </small>
    <p>{{post.snippet}}</p>


</div>
}
